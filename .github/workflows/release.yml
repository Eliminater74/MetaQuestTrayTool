name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.0.0)"
        required: true
        default: "1.1.23"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ inputs.version }}'.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is empty."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use strict major.minor.patch format."
          }
          [xml]$props = Get-Content Directory.Build.props
          $sourceVersion = $props.Project.PropertyGroup.Version
          if ($version -ne $sourceVersion) {
            throw "Release version $version does not match Directory.Build.props version $sourceVersion."
          }
          "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.424

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Restore
        run: dotnet restore MetaQuestTrayTool.sln -r win-x64 --force-evaluate
        shell: pwsh

      - name: Test
        run: dotnet test MetaQuestTrayTool.sln -c Release --no-restore
        shell: pwsh

      - name: Check NuGet vulnerabilities
        run: |
          $result = dotnet list MetaQuestTrayTool.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $result
          if ($result -match '(?m)^\s*>\s+.*\s+(Critical|High|Moderate|Low)\s+') {
            throw "Vulnerable NuGet package detected."
          }
        shell: pwsh

      - name: Build Setup.exe
        run: .\scripts\build-installer.ps1 -Version ${{ steps.version.outputs.version }}
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}
          path: dist/MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 30

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $section = & .\scripts\Extract-Changelog.ps1 -Version $version
          $path = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.AppendLine("## Meta Quest Tray Tool $version")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine($section)
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("---")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("**Windows Setup (recommended):** download ``MetaQuestTrayTool-Setup-$version.exe``, run it, then launch from the Start Menu or system tray.")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("- Self-contained installer (includes .NET 8 — no separate runtime install)")
          [void]$sb.AppendLine("- Settings persist in ``%AppData%\MetaQuestTrayTool\``")
          [void]$sb.AppendLine("- Full history: [CHANGELOG.md](https://github.com/Eliminater74/MetaQuestTrayTool/blob/main/CHANGELOG.md)")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("### Requirements")
          [void]$sb.AppendLine("- Windows 10 / 11 (64-bit)")
          [void]$sb.AppendLine("- Meta Quest PC app and/or SteamVR for the features you use")
          Set-Content -Path $path -Value $sb.ToString().TrimEnd() -Encoding utf8
          "notes_path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Release notes written to $path"
          Get-Content $path

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Meta Quest Tray Tool ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          files: dist/MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}.exe
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: false
          make_latest: true
