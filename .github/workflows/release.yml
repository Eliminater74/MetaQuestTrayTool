name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ inputs.version }}'.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is empty."
          }
          "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build Setup.exe
        run: .\scripts\build-installer.ps1 -Version ${{ steps.version.outputs.version }}
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}
          path: dist/MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Meta Quest Tray Tool ${{ steps.version.outputs.tag }}
          body: |
            ## Meta Quest Tray Tool ${{ steps.version.outputs.version }}

            **Windows Setup (recommended):** download `MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}.exe`, run it, then launch from the Start Menu or system tray.

            - Self-contained installer (includes .NET 8 — no separate runtime install)
            - Inspired by ApollyonVR's Oculus Tray Tool — new C# rewrite, not a decompile
            - Settings persist in `%AppData%\MetaQuestTrayTool\`

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - Meta Quest PC app and/or SteamVR for the features you use

            See [README](https://github.com/Eliminater74/MetaQuestTrayTool#readme) for full feature list.
          files: dist/MetaQuestTrayTool-Setup-${{ steps.version.outputs.version }}.exe
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          make_latest: true
